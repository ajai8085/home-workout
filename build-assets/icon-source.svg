<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="6" y1="3" x2="58" y2="61" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bcff3c" />
      <stop offset="0.42" stop-color="#ff5a3c" />
      <stop offset="0.72" stop-color="#ff2f8e" />
      <stop offset="1" stop-color="#8a3bff" />
    </linearGradient>
    <radialGradient id="sheen" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(20 12) rotate(58) scale(46)">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Full-bleed gradient (safe for maskable / Apple touch icons) -->
  <rect width="64" height="64" fill="url(#bg)" />
  <rect width="64" height="64" fill="url(#sheen)" />

  <!-- Stopwatch tick-ring (the 20-min timer) -->
  <g stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round">
    <line x1="32" y1="9" x2="32" y2="12" />
    <line x1="55" y1="32" x2="52" y2="32" />
    <line x1="32" y1="55" x2="32" y2="52" />
    <line x1="9" y1="32" x2="12" y2="32" />
    <line x1="48.3" y1="15.7" x2="46.2" y2="17.8" />
    <line x1="48.3" y1="48.3" x2="46.2" y2="46.2" />
    <line x1="15.7" y1="48.3" x2="17.8" y2="46.2" />
    <line x1="15.7" y1="15.7" x2="17.8" y2="17.8" />
  </g>

  <!-- Bodyweight figure mid jumping-jack (within maskable safe zone) -->
  <g stroke="#ffffff" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="32" cy="17" r="5" fill="#ffffff" stroke="none" />
    <line x1="32" y1="22.4" x2="32" y2="38.5" />
    <line x1="32" y1="26.8" x2="19.5" y2="16.5" />
    <line x1="32" y1="26.8" x2="44.5" y2="16.5" />
    <line x1="32" y1="38.5" x2="21" y2="50.5" />
    <line x1="32" y1="38.5" x2="43" y2="50.5" />
  </g>
</svg>
