<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="6" y1="3" x2="58" y2="61" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bcff3c" />
      <stop offset="0.42" stop-color="#ff5a3c" />
      <stop offset="0.72" stop-color="#ff2f8e" />
      <stop offset="1" stop-color="#8a3bff" />
    </linearGradient>
    <radialGradient id="sheen" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(19 11) rotate(58) scale(44)">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#ffffff" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Flashy gradient squircle -->
  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#bg)" />
  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#sheen)" />
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="16.25"
    stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Stopwatch tick-ring (the 20-min timer) -->
  <g stroke="#ffffff" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round">
    <line x1="32" y1="7.5" x2="32" y2="10.5" />
    <line x1="56.5" y1="32" x2="53.5" y2="32" />
    <line x1="32" y1="56.5" x2="32" y2="53.5" />
    <line x1="7.5" y1="32" x2="10.5" y2="32" />
    <line x1="49.3" y1="14.7" x2="47.2" y2="16.8" />
    <line x1="49.3" y1="49.3" x2="47.2" y2="47.2" />
    <line x1="14.7" y1="49.3" x2="16.8" y2="47.2" />
    <line x1="14.7" y1="14.7" x2="16.8" y2="16.8" />
  </g>

  <!-- Bodyweight figure mid jumping-jack -->
  <g stroke="#ffffff" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <circle cx="32" cy="16.5" r="5" fill="#ffffff" stroke="none" />
    <line x1="32" y1="22" x2="32" y2="38.5" />
    <line x1="32" y1="26.5" x2="18.5" y2="15.5" />
    <line x1="32" y1="26.5" x2="45.5" y2="15.5" />
    <line x1="32" y1="38.5" x2="20" y2="51.5" />
    <line x1="32" y1="38.5" x2="44" y2="51.5" />
  </g>
</svg>
